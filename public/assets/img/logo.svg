  <!-- check -->
  <path d="M62 64.5l7.5 7.5L85 56.5" fill="none" stroke="#5EEAD4" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <g font-family="'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif">
    <text x="156" y="72" font-size="46" font-weight="600" letter-spacing="-1" fill="#1E2A5A">Ticket<tspan fill="#2F6FDB" font-weight="400">Desk</tspan></text>
    <text x="158" y="100" font-size="13.5" font-weight="500" letter-spacing="3.6" fill="#64748B">SOPORTE · SISTEMAS</text>
