<!--
  Detalle de un ticket en "Mis tickets".
  Variables: id, title, status, statusClass, priority, priorityClass,
             company, branch, category, subcategory, date, assigned
  HTML (ya escapado en app.js): answersHtml, followUpHtml, messagesHtml, filesHtml
-->
<article class="tw-detail">
    <header class="tw-detail-head">
        <div>
            <div class="tw-detail-id">Ticket #{{id}}</div>
            <h3 class="tw-detail-title">{{title}}</h3>
        </div>
        <div class="tw-detail-badges">
            <span class="tw-ticket-prio tw-prio-{{priorityClass}}">{{priority}}</span>
            <span class="tw-status tw-status-{{statusClass}}">{{status}}</span>
        </div>
    </header>

    <div class="tw-review-grid">
        <div class="tw-review-item">
            <span class="tw-review-label">Compañía</span>
            <span class="tw-review-value">{{company}}</span>
            <span class="tw-review-sub">{{branch}}</span>
        </div>
        <div class="tw-review-item">
            <span class="tw-review-label">Categoría</span>
            <span class="tw-review-value">{{category}}</span>
            <span class="tw-review-sub">{{subcategory}}</span>
        </div>
        <div class="tw-review-item">
            <span class="tw-review-label">Creado</span>
            <span class="tw-review-value">{{date}}</span>
            <span class="tw-review-sub">Atiende: {{assigned}}</span>
        </div>
    </div>

    {{{followUpHtml}}}

    {{{answersHtml}}}

    <section class="tw-detail-block">
        <p class="tw-section-label">Conversación</p>
        {{{messagesHtml}}}
    </section>

    {{{filesHtml}}}
</article>
